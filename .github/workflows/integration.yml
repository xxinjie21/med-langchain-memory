name: Integration

# 真实中间件集成测试：**可选**，不阻塞日常 CI（ci.yml 仍为唯一必过门禁）。
# 触发方式：手动 workflow_dispatch，或每日 18:00 UTC（北京时间次日 02:00）夜间定时跑一次。
#
# 覆盖范围：Redis / MySQL / Elasticsearch 三个服务容器，以及用 docker compose 起的
# 三主三从 Redis Cluster（GitHub Actions 的 `services:` 只支持单容器，6 节点集群只能走 compose）。
# 四个服务全部通过 `MED_MEMORY_IT_REQUIRED` 声明为**必需**：跑之前先执行前置守卫
# （`testing/preflight.py`），任一服务不可用即整步失败——否则用例集体 skip 会伪装成绿灯。
#
# 每次运行都会把 pytest 的 JUnit 报告缓存下来，供下一次运行做趋势对比，
# 并把 Markdown 摘要写进 Job Summary（渲染逻辑见 med_langchain_memory/testing/trend.py）。
on:
  workflow_dispatch:
  schedule:
    # 夜间跑一次：18:00 UTC = 次日 02:00（北京时间），避开白天 CI 高峰。
    - cron: "0 18 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration (real middleware)
    runs-on: ubuntu-latest
    # 服务地址集中声明一次：用例步骤与前置守卫步骤共用，避免两处漂移。
    env:
      MED_MEMORY_IT: "1"
      MED_MEMORY_IT_REQUIRED: redis,mysql,elasticsearch,redis-cluster
      MED_MEMORY_IT_REDIS_URL: redis://localhost:16379/15
      MED_MEMORY_IT_MYSQL_URL: mysql+pymysql://root:med@localhost:13306/med_memory
      MED_MEMORY_IT_ELASTICSEARCH_URL: http://localhost:19200
      MED_MEMORY_IT_REDIS_CLUSTER_URL: redis://localhost:17001/0
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: med
          MYSQL_DATABASE: med_memory
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 19200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 滚动缓存：key 带 run_id 保证每次都写新条目，restore-keys 前缀命中最近一次。
      # 缓存内容就是 reports/ 目录，含上一次的 integration.xml 与 integration-trend.md。
      - name: Restore previous JUnit report
        uses: actions/cache@v4
        with:
          path: reports
          key: integration-report-${{ github.run_id }}
          restore-keys: |
            integration-report-

      - name: Keep restored report as baseline
        run: |
          mkdir -p reports
          if [ -f reports/integration.xml ]; then mv reports/integration.xml reports/previous.xml; fi

      # 集群节点广播地址取编排固定子网的网关（172.31.240.1）：
      # Linux runner 上容器与宿主机双向可达，因此无需像 Docker Desktop 那样覆盖。
      - name: Start redis cluster
        env:
          MED_MEMORY_IT_CLUSTER_IP: 172.31.240.1
        run: |
          docker compose -f docker-compose.integration.yml up -d \
            redis-cluster-1 redis-cluster-2 redis-cluster-3 \
            redis-cluster-4 redis-cluster-5 redis-cluster-6
          docker compose -f docker-compose.integration.yml run --rm redis-cluster-init

      # 前置守卫：`MED_MEMORY_IT_REQUIRED` 里的服务必须真的可连，
      # 否则用例会集体 skip 而整轮依旧「绿」，把环境故障伪装成通过。
      - name: Preflight required services
        run: python -m med_langchain_memory.testing.preflight

      - name: Run integration tests
        run: pytest -m integration --junit-xml=reports/integration.xml

      # 无论用例成败都出摘要：pytest 已把失败写进 JUnit，这一步只负责可读化。
      - name: Publish trend summary
        if: always()
        run: |
          python -m med_langchain_memory.testing.trend \
            reports/integration.xml \
            --baseline reports/previous.xml \
            --output reports/integration-trend.md
          cat reports/integration-trend.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: reports/
          retention-days: 30

      - name: Dump redis cluster logs
        if: failure()
        env:
          MED_MEMORY_IT_CLUSTER_IP: 172.31.240.1
        run: docker compose -f docker-compose.integration.yml logs --tail 80

      - name: Tear down redis cluster
        if: always()
        env:
          MED_MEMORY_IT_CLUSTER_IP: 172.31.240.1
        run: docker compose -f docker-compose.integration.yml down -v
