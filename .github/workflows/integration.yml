name: Integration

# 真实中间件集成测试：**可选**，不阻塞日常 CI（ci.yml 仍为唯一必过门禁）。
# 触发方式：手动 workflow_dispatch，或每日 18:00 UTC（北京时间次日 02:00）夜间定时跑一次。
#
# 分片并行：四个真机套件按服务切成四个矩阵分片（redis / mysql / elasticsearch /
# redis-cluster），每个分片在自己的 runner 上**只拉起自己需要的容器**，
# 于是墙钟时间由「最慢的那个分片」决定，而不是「四个服务串行之和」。
#
# 分片表（用例路径 / 必需服务 / compose 服务名 / 初始化容器 / 环境变量）由
# `med_langchain_memory.testing.shards` 生成，工作流里**不出现任何服务地址字面量**，
# 也不硬编码分片名与容器名——新增分片只需改那个模块。
#
# 中间件统一走 docker compose：`services:` 无法按矩阵分片（会让每个分片都拉起全部容器），
# 而 Redis Cluster 本来就只能用 compose。compose 里每个长驻服务都有 healthcheck，
# `up -d --wait` 会等到健康后再进入守卫与用例步骤。
#
# 汇总作业：四个分片跑完后由 `aggregate` 作业把四份 JUnit 报告聚合成一份总账
# （分片明细 + 合计 + 缺失报告 + 失败用例）贴进 Job Summary，并用单一退出码
# 给出整轮结论——不必点开四个作业才知道今晚绿没绿。
# 总账本身还会与**上一轮总账**对比（用例数 / 失败数 / 通过率 / 耗时的变化 +
# 逐分片状态 + 跨分片的新增失败与已修复）：上一轮的报告由本作业末尾的快照
# 写进 `baseline/`，靠滚动缓存传给下一次运行，不需要任何外部存储。
on:
  workflow_dispatch:
  schedule:
    # 夜间跑一次：18:00 UTC = 次日 02:00（北京时间），避开白天 CI 高峰。
    - cron: "0 18 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # fail-fast: false —— 一个分片红不代表其它分片没有价值，四个分片各自出结论。
    strategy:
      fail-fast: false
      matrix:
        shard: [redis, mysql, elasticsearch, redis-cluster]
    env:
      # 集群节点广播地址：Linux runner 上编排固定子网的网关双向可达，无需像
      # Docker Desktop 那样覆盖成宿主机局域网 IP。
      MED_MEMORY_IT_CLUSTER_IP: 172.31.240.1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 分片环境由 shards 模块生成：总开关 + 本分片的必需服务清单 + 本分片服务地址。
      - name: Resolve shard environment
        run: python -m med_langchain_memory.testing.shards --shard "${{ matrix.shard }}" --format env >> "$GITHUB_ENV"

      # 滚动缓存：key 带 run_id 保证每次都写新条目，restore-keys 前缀命中同一分片的上一次。
      # 缓存内容是该分片自己的 reports/<shard>/ 目录。
      - name: Restore previous JUnit report
        uses: actions/cache@v4
        with:
          path: reports/${{ matrix.shard }}
          key: integration-report-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            integration-report-${{ matrix.shard }}-

      - name: Keep restored report as baseline
        run: |
          mkdir -p "reports/${{ matrix.shard }}"
          if [ -f "reports/${{ matrix.shard }}/integration.xml" ]; then
            mv "reports/${{ matrix.shard }}/integration.xml" \
               "reports/${{ matrix.shard }}/previous.xml"
          fi

      # 只拉起本分片需要的容器，并等健康检查通过。
      - name: Start shard services
        run: |
          docker compose -f docker-compose.integration.yml up -d --wait \
            $(python -m med_langchain_memory.testing.shards --shard "${{ matrix.shard }}" --format compose)

      # 集群分片多一步一次性组集群；非集群分片这里拿到空串，整步无事发生。
      - name: Run shard initializer
        run: |
          initializer=$(python -m med_langchain_memory.testing.shards --shard "${{ matrix.shard }}" --format init)
          if [ -n "$initializer" ]; then
            docker compose -f docker-compose.integration.yml run --rm "$initializer"
          fi

      # 前置守卫：本分片声明的服务必须真的可连，否则用例会集体 skip 而整轮依旧「绿」，
      # 把环境故障伪装成通过。
      - name: Preflight required services
        run: python -m med_langchain_memory.testing.preflight

      - name: Run integration tests
        run: |
          pytest -m integration \
            --junit-xml="reports/${{ matrix.shard }}/integration.xml" \
            $(python -m med_langchain_memory.testing.shards --shard "${{ matrix.shard }}" --format paths)

      # 无论用例成败都出摘要：pytest 已把失败写进 JUnit，这一步只负责可读化。
      - name: Publish trend summary
        if: always()
        run: |
          python -m med_langchain_memory.testing.trend \
            "reports/${{ matrix.shard }}/integration.xml" \
            --baseline "reports/${{ matrix.shard }}/previous.xml" \
            --output "reports/${{ matrix.shard }}/integration-trend.md"
          cat "reports/${{ matrix.shard }}/integration-trend.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report-${{ matrix.shard }}
          path: reports/${{ matrix.shard }}/
          retention-days: 30

      - name: Dump service logs
        if: failure()
        run: docker compose -f docker-compose.integration.yml logs --tail 80

      - name: Tear down services
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v

  # 汇总作业：把四个分片的报告合成一份总账，并给出整轮唯一的结论退出码。
  # 期望的分片清单由分片表决定（与上面矩阵取值同源），工作流不重复声明。
  aggregate:
    name: Aggregate shard reports
    needs: integration
    # 矩阵作业用 fail-fast: false 跑完四个分片，这里无论成败都要出总账。
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 四个分片的报告 artifact 解到 reports/ 下；目录名即 artifact 名，
      # 聚合模块对这种「下载布局」与本地「reports/<分片>/」布局都认。
      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: integration-report-*
          path: reports

      # 滚动总账基线：恢复上一轮由 --snapshot-dir 写下的四个分片报告，
      # 本轮聚合时据此给出「整轮 vs 上一轮」的对比。key 带 run_id 保证每次都写新条目，
      # restore-keys 前缀命中上一次；首次运行缓存未命中时不渲染对比小节。
      - name: Restore previous ledger baseline
        uses: actions/cache@v4
        with:
          path: baseline
          key: integration-baseline-${{ github.run_id }}
          restore-keys: |
            integration-baseline-

      # 缺报告或存在失败用例时本步退出码非 0（整轮结论），但汇总文件已先写好；
      # 同时把本轮报告快照进 baseline/，随缓存滚动给下一轮当基线。
      - name: Aggregate shard reports
        run: |
          python -m med_langchain_memory.testing.aggregate \
            --reports-dir reports \
            --baseline-dir baseline \
            --snapshot-dir baseline \
            --output "reports/integration-aggregate.md"

      # 与上一步解耦：上一步失败也要把总账贴进 Job Summary，否则最需要的信息反而看不到。
      - name: Publish aggregate summary
        if: always()
        run: cat "reports/integration-aggregate.md" >> "$GITHUB_STEP_SUMMARY"
