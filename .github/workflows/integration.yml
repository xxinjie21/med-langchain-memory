name: Integration

# 真实中间件集成测试：**可选**，不阻塞日常 CI（ci.yml 仍为唯一必过门禁）。
# 触发方式：手动 workflow_dispatch，或每日 18:00 UTC（北京时间次日 02:00）夜间定时跑一次。
#
# 分片并行：真机套件按服务切成五个矩阵分片（redis / mysql / elasticsearch /
# redis-cluster / redis-cluster-failover），每个分片在自己的 runner 上**只拉起自己需要的容器**，
# 于是墙钟时间由「最慢的那个分片」决定，而不是「全部服务串行之和」。
# 破坏性演练（停主节点 → 从节点晋升）单独成片：它自己起一套集群，不污染只读套件。
#
# 分片表（用例路径 / 必需服务 / compose 服务名 / 初始化容器 / 环境变量 / 超时预算）
# 由 `med_langchain_memory.testing.shards` 生成：`plan` 作业把它算成矩阵 JSON
# 写进 `$GITHUB_OUTPUT`，`integration` 作业用 `fromJSON` 消费——工作流里**不出现任何
# 服务地址字面量，也不出现分片名清单**，新增分片只需改那个模块。
#
# 中间件统一走 docker compose：`services:` 无法按矩阵分片（会让每个分片都拉起全部容器），
# 而 Redis Cluster 本来就只能用 compose。compose 里每个长驻服务都有 healthcheck，
# `up -d --wait` 会等到健康后再进入守卫与用例步骤。
#
# 汇总作业：五个分片跑完后由 `aggregate` 作业把五份 JUnit 报告聚合成一份总账
# （分片明细 + 合计 + 缺失报告 + 失败用例）贴进 Job Summary，并用单一退出码
# 给出整轮结论——不必点开五个作业才知道今晚绿没绿。
# 总账本身还会与**上一轮总账**对比：整轮合计的变化、逐分片状态、跨分片的新增
# 失败与已修复，以及**逐分片用例级趋势**（D47 两套基线合一——分片粒度的趋势
# 原先由各分片作业用 trend CLI 各自维护、各滚一份缓存，现在统一上收本作业，
# 整轮与分片粒度共享同一份基线）。上一轮的报告由本作业末尾的快照写进
# `baseline/`，靠滚动缓存传给下一次运行，不需要任何外部存储。
# 看板作业（D48）：`dashboard` 作业把同一份总账渲染成自包含 HTML 页面
# （`testing/dashboard.py`，纯标准库）发布到 GitHub Pages，给夜间报告一个
# 固定 URL 的日常入口；它只读 artifact、不拉容器、不持门禁状态。
# 状态徽章（D49）：`aggregate` 作业末尾把整轮结论回写成 commit status
# （context: `integration/nightly`，`testing/notifier.py`，纯标准库），
# README 徽章与提交检查列表因此都有「最近一轮夜间集成绿没绿」的一眼结论；
# 发布失败只是徽章没更新，步骤带 `continue-on-error`，不染红任何测试结论。
on:
  workflow_dispatch:
  schedule:
    # 夜间跑一次：18:00 UTC = 次日 02:00（北京时间），避开白天 CI 高峰。
    - cron: "0 18 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 分片矩阵的唯一真值来源：分片表 → 单行 JSON → 作业输出。
  plan:
    name: Plan shard matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 只装运行期依赖：这一步只为了 import 分片表并打印 JSON，不需要 dev extras。
      - name: Install dependencies
        run: pip install -e .

      - name: Emit shard matrix
        id: matrix
        run: echo "matrix=$(python -m med_langchain_memory.testing.shards --format matrix)" >> "$GITHUB_OUTPUT"

  integration:
    name: Integration (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    # 墙钟预算由分片表逐片给出：卡死的 compose 或 pytest 会被及时掐掉，
    # 而不是把 runner 的 6 小时上限耗光。
    timeout-minutes: ${{ matrix.timeout_minutes }}
    # fail-fast: false —— 一个分片红不代表其它分片没有价值，五个分片各自出结论。
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # 集群节点广播地址：Linux runner 上编排固定子网的网关双向可达，无需像
      # Docker Desktop 那样覆盖成宿主机局域网 IP。
      MED_MEMORY_IT_CLUSTER_IP: 172.31.240.1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 分片环境由 shards 模块生成：总开关 + 本分片的必需服务清单 + 本分片服务地址。
      - name: Resolve shard environment
        run: python -m med_langchain_memory.testing.shards --shard "${{ matrix.shard }}" --format env >> "$GITHUB_ENV"

      # 只拉起本分片需要的容器，并等健康检查通过。
      - name: Start shard services
        run: |
          docker compose -f docker-compose.integration.yml up -d --wait \
            $(python -m med_langchain_memory.testing.shards --shard "${{ matrix.shard }}" --format compose)

      # 集群分片多一步一次性组集群；非集群分片这里拿到空串，整步无事发生。
      - name: Run shard initializer
        run: |
          initializer=$(python -m med_langchain_memory.testing.shards --shard "${{ matrix.shard }}" --format init)
          if [ -n "$initializer" ]; then
            docker compose -f docker-compose.integration.yml run --rm "$initializer"
          fi

      # 前置守卫：本分片声明的服务必须真的可连，否则用例会集体 skip 而整轮依旧「绿」，
      # 把环境故障伪装成通过。
      - name: Preflight required services
        run: python -m med_langchain_memory.testing.preflight

      - name: Run integration tests
        run: |
          pytest -m integration \
            --junit-xml="reports/${{ matrix.shard }}/integration.xml" \
            $(python -m med_langchain_memory.testing.shards --shard "${{ matrix.shard }}" --format paths)

      # 无论用例成败都上传报告：pytest 已把失败写进 JUnit，汇总作业据此出总账与
      # 逐分片趋势（D47 起趋势与基线统一上收 aggregate 作业，分片不再各自渲染）。
      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report-${{ matrix.shard }}
          path: reports/${{ matrix.shard }}/
          retention-days: 30

      - name: Dump service logs
        if: failure()
        run: docker compose -f docker-compose.integration.yml logs --tail 80

      - name: Tear down services
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v

  # 汇总作业：把五个分片的报告合成一份总账，并给出整轮唯一的结论退出码。
  # 期望的分片清单由分片表决定（与上面矩阵取值同源），工作流不重复声明。
  aggregate:
    name: Aggregate shard reports
    needs: integration
    # 矩阵作业用 fail-fast: false 跑完五个分片，这里无论成败都要出总账。
    if: always()
    runs-on: ubuntu-latest
    # 最小权限：只有本作业需要回写 commit status（D49 状态徽章）；
    # 看板作业另持 Pages 分支写权限，其余作业保持默认只读。
    permissions:
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 五个分片的报告 artifact 解到 reports/ 下；目录名即 artifact 名，
      # 聚合模块对这种「下载布局」与本地「reports/<分片>/」布局都认。
      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: integration-report-*
          path: reports

      # 滚动总账基线：恢复上一轮由 --snapshot-dir 写下的五个分片报告，
      # 本轮聚合时据此给出「整轮 vs 上一轮」的对比。key 带 run_id 保证每次都写新条目，
      # restore-keys 前缀命中上一次；首次运行缓存未命中时不渲染对比小节。
      - name: Restore previous ledger baseline
        uses: actions/cache@v4
        with:
          path: baseline
          key: integration-baseline-${{ github.run_id }}
          restore-keys: |
            integration-baseline-

      # 缓存未命中时 baseline/ 不存在，先建目录保证后面的 artifact 上传有路径可传。
      - name: Ensure baseline directory exists
        run: mkdir -p baseline

      # 「账本」artifact：把本轮分片报告与**恢复出来的上一轮基线**打成一个包，
      # 供看板作业渲染「与上一轮对比」。必须在聚合之前上传——聚合步骤的
      # --snapshot-dir 会把 baseline/ 覆盖成本轮快照，之后再上传就只剩「本轮 vs 本轮」。
      - name: Upload ledger artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-ledger
          path: |
            reports
            baseline
          retention-days: 90

      # 缺报告或存在失败用例时本步退出码非 0（整轮结论），但汇总文件已先写好；
      # 同时把本轮报告快照进 baseline/，随缓存滚动给下一轮当基线。
      - name: Aggregate shard reports
        run: |
          python -m med_langchain_memory.testing.aggregate \
            --reports-dir reports \
            --baseline-dir baseline \
            --snapshot-dir baseline \
            --output "reports/integration-aggregate.md"

      # 与上一步解耦：上一步失败也要把总账贴进 Job Summary，否则最需要的信息反而看不到。
      - name: Publish aggregate summary
        if: always()
        run: cat "reports/integration-aggregate.md" >> "$GITHUB_STEP_SUMMARY"

      # 状态徽章（D49）：把整轮结论回写成 commit status（context: integration/nightly），
      # 于是 README 徽章与提交检查列表都有「最近一轮绿没绿」的一眼结论。结论由
      # notifier 复用聚合口径现算（读同一份 reports/，verdict_exit_code 与聚合 CLI
      # 同源），不依赖上一步的退出码传递；token 走 env 不进命令行。推送失败只是
      # 「徽章没更新」，不该把作业染红，故 continue-on-error。
      - name: Post nightly integration status
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m med_langchain_memory.testing.notifier \
            --repo "${{ github.repository }}" \
            --sha "${{ github.sha }}" \
            --reports-dir reports \
            --target-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # 看板作业（D48）：把汇总作业的同一份总账渲染成自包含 HTML 页面，发布到
  # GitHub Pages（gh-pages 分支）。看板只是「附加视图」——不持有任何门禁状态，
  # 矩阵或汇总红了也要发布，否则最需要看板的时候反而没有看板。
  dashboard:
    name: Publish nightly dashboard
    needs: aggregate
    if: always()
    runs-on: ubuntu-latest
    # 最小权限：只有本作业需要写 gh-pages 分支，其余作业保持默认只读。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 只装运行期依赖：渲染看板是纯标准库逻辑，不需要 dev extras，也不拉任何容器。
      - name: Install dependencies
        run: pip install -e .

      # 账本 artifact 里既有本轮分片报告（reports/），也有聚合时恢复出来的
      # 上一轮基线（baseline/）——看板的对比小节与 Job Summary 同源同口径。
      - name: Download ledger artifact
        uses: actions/download-artifact@v4
        with:
          name: integration-ledger
          path: ledger

      - name: Render dashboard page
        run: |
          python -m med_langchain_memory.testing.dashboard \
            --reports-dir ledger/reports \
            --baseline-dir ledger/baseline \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "site/index.html"

      # 发布到 GitHub Pages：gh-pages 分支的 index.html 即「最近一轮夜间看板」。
      # keep_files 保留历史文件，本作业每轮只覆盖 index.html。
      - name: Publish dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
