[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "med-langchain-memory"
version = "0.1.0"
description = "Medical-grade distributed chat message history middleware for LangChain"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "xxinjie21", email = "xxinjie21@163.com" }]
keywords = ["langchain", "chat-history", "medical", "memory", "middleware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langchain-core>=0.3,<0.4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "protobuf>=5.26,<6",
]

[project.optional-dependencies]
redis = ["redis>=5.0,<6"]
mysql = ["SQLAlchemy>=2.0,<3"]
es = ["elasticsearch>=8.0,<9"]
api = ["fastapi>=0.110,<1"]
token = ["tiktoken>=0.7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "fakeredis>=2.23",
    "pre-commit>=3.7",
    "grpcio-tools>=1.66",
]

[project.urls]
Repository = "https://github.com/xxinjie21/med-langchain-memory"

[tool.hatch.build.targets.wheel]
packages = ["src/med_langchain_memory"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["med_langchain_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
